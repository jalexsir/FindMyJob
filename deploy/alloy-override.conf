# Systemd drop-in для сервісу alloy — жорсткий стелю ресурсів, щоб на
# маленькому VPS (Oracle Always Free) агент моніторингу фізично не міг
# з'їсти помітну частку пам'яті/CPU понад те, що йому реально треба для
# пересилання логів одного невеликого процесу.
#
# Кладеться в /etc/systemd/system/alloy.service.d/override.conf (створи
# каталог, якщо його немає), після цього:
#   sudo systemctl daemon-reload && sudo systemctl restart alloy
#
# Офіційний пакет alloy сам ставить базовий /lib/systemd/system/alloy.service —
# цей файл лише ДОПОВНЮЄ його, не замінює.

[Service]
# М'яка межа: якщо перевищено — процес не вбивається, лише пам'ять активніше
# віддається під тиском ядра (throttling), для нормальної роботи не заважає.
# 128М, а не менше: заміряно на реальному сервері — сам процес Alloy (Go-
# рантайм + внутрішній WAL/HTTP) споживає ~64М одразу після старту навіть у
# мінімальній конфігурації (лише один loki.source.journal), тож менший
# ліміт означав би постійний throttling без жодної користі.
MemoryHigh=128M
# Жорстка межа: перевищення = OOM-kill процесу alloy (не бота — вони окремі
# юніти). Подвійний запас понад MemoryHigh — страхує від витоку/аномалії, не
# зачіпаючи нормальну роботу.
MemoryMax=256M
# Не більше 10% одного ядра в середньому — пересилання кількох рядків
# логу на годину не потребує більшого, а лишає ресурси самому боту.
CPUQuota=10%
